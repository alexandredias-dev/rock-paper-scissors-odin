<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero">
    <img src="https://upload.wikimedia.org/wikipedia/en/c/cf/RockPaperScissorsLogo.png" alt="Logo">
    <p id="resultado">Escolha pedra, papel ou tesoura...</p>
    
    <div class="botoes">
        <button id="pedra" class="btn-escolha">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/009/308/172/small/hand-with-the-fist-making-the-communism-symbol-on-transparent-background-file-png.png" alt="Pedra">
            <span>Pedra</span>
        </button>
        <button id="papel" class="btn-escolha">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/052/649/572/small/open-hand-for-connection-png.png" alt="Papel">
            <span>Papel</span>
        </button>
        <button id="tesoura" class="btn-escolha">
            <img src="https://static.vecteezy.com/system/resources/previews/051/690/528/non_2x/a-hand-with-two-fingers-up-in-the-air-free-png.png" alt="Tesoura">
            <span>Tesoura</span>
        </button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
